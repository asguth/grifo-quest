[package]
name = "grifo-quest-mcp"
version = "0.2.1"
edition = "2024"
license-file = "../LICENSE"
description = "Servidor MCP (stdio, somente leitura) com os dados do Grifo Quest"

[dependencies]
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "io-std"] }
serde.workspace = true
serde_json.workspace = true
schemars = "1"
sqlx.workspace = true

[dev-dependencies]
# O teste roda as consultas contra o esquema real (migrações do app).
sqlx = { workspace = true, features = ["migrate", "macros"] }
