name: 💡 Ideia
description: Sugira algo para o Grifo Quest
labels: [ideia]
body:
  - type: textarea
    id: ideia
    attributes:
      label: Qual a ideia?
      description: O que você queria fazer no app e por quê (como isso ajuda no estudo).
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do app
