[package]
name = "grifo-quest"
version = "0.2.4"
description = "Monitor de estudos para concursos"
authors = ["Alberto Guth"]
license-file = "../LICENSE"
edition = "2024"

[lib]
name = "grifo_quest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tokio = { workspace = true, features = ["time", "process", "io-util", "sync"] }
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
feed-rs = "3"
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["migrate", "macros"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
thiserror = "2"
strsim = "0.11"
pdf-extract = "0.9"
base64 = "0.22"
cpal = "0.18"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["windows-native"] }
unicode-normalization = "0.1"
